# Nginx — WorkChat
# Fallback SPA cho deep-link (/, /@user, /@user/c/<id>, /u/<id>, /r/<code>)
# nhưng KHÔNG fallback cho /api, /ws và asset tĩnh.
server {
    listen 80;
    server_name app.company.com;

    root /var/www/workchat;
    index index.html;

    # API tracker (HTTP) — giữ nguyên, không fallback.
    location /api/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket realtime — cần nâng cấp kết nối.
    location /ws {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Asset tĩnh (có đuôi file): phục vụ trực tiếp + cache dài.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|map|json)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Mọi path còn lại (deep-link SPA) → index.html.
    location / {
        try_files $uri /index.html;
    }
}
